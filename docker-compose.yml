services:

  # =========================
  # MYSQL DATABASE
  # =========================
  mysql:
    image: mysql:8.0
    container_name: de3_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: WordPress@2026Secure
      MYSQL_ROOT_PASSWORD: Root@2026Secure!
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend

  # =========================
  # WORDPRESS
  # =========================
  wordpress:
    image: wordpress:latest
    container_name: de3_wordpress
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: WordPress@2026Secure
    volumes:
      - wordpress_data:/var/www/html
    ports:
      - "8083:80"
    networks:
      - frontend
      - backend

  # =========================
  # PHPMYADMIN
  # =========================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: de3_phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: Root@2026Secure!
    ports:
      - "8081:80"
    networks:
      - frontend
      - backend

  # =========================
  # NGINX REVERSE PROXY
  # =========================
  nginx:
    image: nginx:alpine
    container_name: de3_nginx
    restart: unless-stopped
    depends_on:
      - wordpress
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend


# =========================
# NETWORKS
# =========================
networks:

  frontend:
    driver: bridge

  backend:
    driver: bridge
    internal: true


# =========================
# VOLUMES
# =========================
volumes:

  mysql_data:

  wordpress_data:
